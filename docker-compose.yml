services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentic-editor-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WS_URL: ws://localhost:8000/ws
    container_name: agentic-editor-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
